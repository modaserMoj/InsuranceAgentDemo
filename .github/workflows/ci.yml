name: CI

on:
  push:
  pull_request:

jobs:
  tests-and-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q tests/unit
      - name: Integration tests
        run: pytest -q tests/integration
      - name: Offline evals (deterministic, no API key)
        run: python -m evals.run --offline --no-judge
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sop-claims-agent .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 sop-claims-agent
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break; sleep 2; done
          curl -fsS localhost:8000/api/config
          curl -fsS -X POST localhost:8000/api/sessions -H 'content-type: application/json' -d '{"offline": true}' | grep -q session_id
